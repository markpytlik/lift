<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%230a84ff'/><text x='50%25' y='62%25' text-anchor='middle' font-family='-apple-system,SF Pro Display,sans-serif' font-weight='800' font-size='90' fill='white'>L</text></svg>">
<title>Lift</title>
<style>
:root{
  --bg:#000;
  --card:#1c1c1e;
  --card-2:#2c2c2e;
  --text:#fff;
  --text-2:#98989f;
  --text-3:#636366;
  --accent:#0a84ff;
  --green:#30d158;
  --red:#ff453a;
  --orange:#ff9f0a;
  --yellow:#ffd60a;
  --purple:#bf5af2;
  --pink:#ff375f;
  --hairline:rgba(255,255,255,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;font-size:17px;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(env(safe-area-inset-bottom) + 130px);min-height:100vh}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}

.header{padding:14px 20px 4px}
.date{font-size:13px;text-transform:uppercase;color:var(--text-2);letter-spacing:.6px;font-weight:600;margin-bottom:4px}
.day-name{font-size:32px;font-weight:700;letter-spacing:-.5px;margin:0 0 12px}

.segment{display:flex;background:var(--card);border-radius:10px;padding:3px;margin:0 0 14px;gap:0}
.segment button{flex:1;padding:8px 0;border-radius:8px;font-size:14px;font-weight:600;color:var(--text-2);transition:all .2s ease}
.segment button.active{background:var(--card-2);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.3)}

.day-pills{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;-webkit-overflow-scrolling:touch}
.day-pills::-webkit-scrollbar{display:none}
.day-pill{flex:0 0 auto;padding:8px 0;border-radius:14px;background:var(--card);font-size:11px;font-weight:600;color:var(--text-2);display:flex;flex-direction:column;align-items:center;width:44px;line-height:1.1;letter-spacing:.6px;text-transform:uppercase}
.day-pill .num{font-size:17px;color:var(--text);margin-top:3px;letter-spacing:0;text-transform:none}
.day-pill.today{background:var(--accent);color:rgba(255,255,255,.85)}
.day-pill.today .num{color:#fff}
.day-pill.active:not(.today){box-shadow:inset 0 0 0 2px var(--accent)}

.workout-banner{background:var(--card);border-radius:16px;padding:18px 20px;margin:0 16px 4px}
.workout-banner.cardio{background:linear-gradient(135deg,#1c1c1e 0%,#2a1f3a 100%)}
.workout-banner.rest{background:linear-gradient(135deg,#1c1c1e 0%,#1f2a30 100%)}
.workout-banner.recovery{background:linear-gradient(135deg,#1c1c1e 0%,#1d2e22 100%)}
.workout-tag{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px}
.workout-tag.cardio{color:var(--purple)}
.workout-tag.rest{color:var(--yellow)}
.workout-tag.recovery{color:var(--green)}
.workout-title{font-size:24px;font-weight:700;letter-spacing:-.3px;margin:0 0 4px}
.workout-subtitle{font-size:14px;color:var(--text-2);line-height:1.35}

.section-heading{font-size:22px;font-weight:700;letter-spacing:-.3px;padding:24px 20px 8px;margin:0}
.section-heading-row{display:flex;align-items:baseline;justify-content:space-between;padding:24px 20px 8px}
.section-heading-row h2{font-size:22px;font-weight:700;letter-spacing:-.3px;margin:0}
.section-heading-row span{font-size:13px;color:var(--text-2)}

.exercise{background:var(--card);border-radius:16px;margin:0 16px 12px;padding:18px;transition:background .35s ease;position:relative}
.exercise.complete{background:linear-gradient(135deg,#0e3d22 0%,#1a4f2c 100%)}
.exercise-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}
.exercise-num-row{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.exercise-num{font-size:11px;color:var(--text-2);font-weight:700;letter-spacing:.6px}
.exercise.complete .exercise-num{color:rgba(255,255,255,.65)}
.level-badge{font-size:10px;font-weight:700;background:var(--accent);color:#fff;padding:2px 7px;border-radius:6px;letter-spacing:.4px}
.level-badge.maxed{background:linear-gradient(135deg,#ff9f0a,#ff375f)}
.exercise.complete .level-badge{background:rgba(255,255,255,.95);color:var(--green)}
.exercise-name{font-size:17px;font-weight:600;letter-spacing:-.2px;line-height:1.25;margin:0}
.exercise-meta{font-size:13px;color:var(--text-2);margin-top:5px}
.exercise.complete .exercise-meta{color:rgba(255,255,255,.85)}
.exercise-weight{flex:0 0 auto;text-align:right}
.exercise-weight .w{font-size:22px;font-weight:700;letter-spacing:-.3px;line-height:1}
.exercise-weight .l{font-size:10px;color:var(--text-2);text-transform:uppercase;letter-spacing:.6px;margin-top:3px}
.exercise.complete .exercise-weight .l{color:rgba(255,255,255,.7)}

.set-dots{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
.set-dot{width:42px;height:42px;border-radius:50%;border:2px solid var(--text-3);background:transparent;display:flex;align-items:center;justify-content:center;transition:all .18s ease;font-weight:700;color:var(--text-3);font-size:13px}
.set-dot:active{transform:scale(.92)}
.set-dot.done{background:var(--green);border-color:var(--green);color:#fff}
.exercise.complete .set-dot{border-color:rgba(255,255,255,.4);color:rgba(255,255,255,.7)}
.exercise.complete .set-dot.done{background:#fff;border-color:#fff;color:var(--green)}

/* Per-set rows with editable weight */
.set-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.set-row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--card-2);border-radius:12px;transition:background .2s ease}
.set-row.done{background:rgba(48,209,88,.18)}
.exercise.complete .set-row{background:rgba(255,255,255,.08)}
.exercise.complete .set-row.done{background:rgba(255,255,255,.18)}
.set-row .set-num{font-size:13px;font-weight:700;color:var(--text-2);width:30px;flex:0 0 auto;letter-spacing:.4px}
.set-row.done .set-num{color:var(--green)}
.exercise.complete .set-row.done .set-num{color:#fff}
.set-row .set-target{font-size:13px;color:var(--text-2);flex:1;min-width:0;font-variant-numeric:tabular-nums}
.exercise.complete .set-row .set-target{color:rgba(255,255,255,.85)}
.set-row .weight-input{width:62px;background:var(--card);border:1px solid var(--hairline);color:var(--text);padding:7px 4px;border-radius:8px;font-size:15px;font-weight:600;text-align:center;-webkit-appearance:none;font-family:inherit;font-variant-numeric:tabular-nums;flex:0 0 auto}
.set-row .weight-input:focus{outline:2px solid var(--accent);border-color:transparent}
.set-row .weight-input.bw{background:transparent;border:0;color:var(--text-2);font-size:13px;font-weight:600;width:40px;padding:0;pointer-events:none}
.set-row .weight-unit{font-size:11px;color:var(--text-2);font-weight:600;letter-spacing:.4px;flex:0 0 auto;width:20px}
.set-row .set-check-btn{width:34px;height:34px;border-radius:50%;border:2px solid var(--text-3);background:transparent;display:flex;align-items:center;justify-content:center;transition:all .18s ease;color:var(--text-3);flex:0 0 auto;font-weight:700;font-size:13px}
.set-row .set-check-btn:active{transform:scale(.92)}
.set-row.done .set-check-btn{background:var(--green);border-color:var(--green);color:#fff}
.exercise.complete .set-row .set-check-btn{border-color:rgba(255,255,255,.4);color:rgba(255,255,255,.7)}
.exercise.complete .set-row.done .set-check-btn{background:#fff;border-color:#fff;color:var(--green)}

/* Run / cardio log card */
.run-card{margin:0 16px 16px;background:var(--card);border-radius:14px;overflow:hidden}
.run-row{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;-webkit-user-select:none}
.run-row:active{background:var(--card-2)}
.run-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--text-3);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;transition:all .15s ease}
.run-check.on{background:var(--purple);border-color:var(--purple)}
.run-info{flex:1;min-width:0}
.run-label{font-size:15px;font-weight:600;letter-spacing:-.1px}
.run-sub{font-size:12px;color:var(--text-2);margin-top:2px}
.run-fields{padding:0 16px 14px;display:none;flex-direction:column;gap:10px;border-top:1px solid var(--hairline)}
.run-card.open .run-fields{display:flex;padding-top:14px}
.run-field-row{display:flex;gap:10px;align-items:stretch}
.run-field{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.run-field label{font-size:11px;font-weight:700;color:var(--text-2);letter-spacing:.5px;text-transform:uppercase}
.run-field input,.run-field textarea{background:var(--card-2);border:1px solid var(--hairline);color:var(--text);padding:10px 12px;border-radius:10px;font-size:15px;font-family:inherit;-webkit-appearance:none;width:100%;font-variant-numeric:tabular-nums}
.run-field textarea{resize:none;min-height:60px;font-size:14px;line-height:1.4;font-variant-numeric:normal}
.run-field input:focus,.run-field textarea:focus{outline:2px solid var(--purple);border-color:transparent}
.run-summary{font-size:12px;color:var(--text-2);padding:0 16px 14px;line-height:1.4}
.run-summary b{color:var(--text);font-weight:600}

/* Workout score card — appears when day status is 'done' */
.score-card{margin:6px 16px 16px;border-radius:18px;padding:1.5px;background:linear-gradient(135deg,#ff9f0a 0%,#ff375f 60%,#bf5af2 100%)}
.score-inner{background:var(--bg);border-radius:16.5px;padding:20px}
.score-tag{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;background:linear-gradient(135deg,#ff9f0a,#ff375f);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px}
.score-row{display:flex;align-items:flex-end;gap:14px;margin-bottom:14px}
.score-num{font-size:64px;font-weight:800;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,#ff9f0a,#ff375f,#bf5af2);-webkit-background-clip:text;background-clip:text;color:transparent}
.score-grade{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding-bottom:6px}
.score-grade .g{font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1;color:var(--text)}
.score-grade .glabel{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-2)}
.score-headline{font-size:14px;color:var(--text);font-weight:600;line-height:1.3;margin-bottom:14px}
.score-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.score-stat{background:var(--card);border-radius:10px;padding:10px 12px}
.score-stat .label{font-size:10px;font-weight:700;color:var(--text-2);letter-spacing:.5px;text-transform:uppercase;margin-bottom:3px}
.score-stat .value{font-size:18px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.score-stat .sub{font-size:11px;color:var(--text-2);margin-top:2px}
.score-empty{font-size:13px;color:var(--text-2);line-height:1.4}

.next-up{margin-top:12px;font-size:11px;color:var(--text-2);letter-spacing:.4px;text-transform:uppercase;font-weight:600}
.exercise.complete .next-up{color:rgba(255,255,255,.85)}

.exercise-notes{margin-top:14px;padding-top:14px;border-top:1px solid var(--hairline);font-size:13px;color:var(--text-2);line-height:1.5}
.exercise.complete .exercise-notes{border-top-color:rgba(255,255,255,.18);color:rgba(255,255,255,.85)}
.video-link{display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:8px 14px;border-radius:10px;background:rgba(10,132,255,.16);color:var(--accent);font-size:13px;font-weight:600;text-decoration:none;transition:background .18s ease}
.video-link:active{background:rgba(10,132,255,.32)}
.exercise.complete .video-link{background:rgba(255,255,255,.2);color:#fff}

/* Muscle diagram + targets */
.muscle-row{margin-top:14px;padding-top:14px;border-top:1px solid var(--hairline);display:flex;align-items:center;gap:14px}
.exercise.complete .muscle-row{border-top-color:rgba(255,255,255,.18)}
.body-diagram{flex:0 0 auto;width:54px;height:auto}
.body-svg{width:54px;height:auto;display:block}
.muscle-text{flex:1;min-width:0}
.muscle-label{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-2);margin-bottom:3px}
.exercise.complete .muscle-label{color:rgba(255,255,255,.7)}
.muscle-list{font-size:14px;color:var(--text);font-weight:500;line-height:1.4}

/* Make-up banner */
.makeup-banner{margin:0 16px 12px;padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,#ff9f0a 0%,#ff375f 100%);display:flex;align-items:center;gap:14px;cursor:pointer;-webkit-user-select:none;transition:transform .15s ease}
.makeup-banner:active{transform:scale(.98)}
.makeup-icon{flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff}
.makeup-text{flex:1;min-width:0}
.makeup-title{font-size:14px;font-weight:700;color:#fff;letter-spacing:-.1px;line-height:1.25}
.makeup-sub{font-size:12px;color:rgba(255,255,255,.92);margin-top:2px;line-height:1.35}

/* Daily log (creatine + protein) */
.supps-card{margin:0 16px 16px;background:var(--card);border-radius:14px;overflow:hidden}
.supps-row{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;-webkit-user-select:none;border-bottom:1px solid var(--hairline)}
.supps-row:last-child{border-bottom:none}
.supps-row:active{background:var(--card-2)}
.supps-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--text-3);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;transition:all .15s ease}
.supps-check.on{background:var(--green);border-color:var(--green)}
.supps-info{flex:1;min-width:0}
.supps-label{font-size:15px;font-weight:600;letter-spacing:-.1px}
.supps-sub{font-size:12px;color:var(--text-2);margin-top:2px}
.supps-amt{flex:0 0 auto;font-size:13px;font-weight:600;color:var(--text-2);padding:6px 10px;border-radius:8px;background:var(--card-2)}
.supps-amt-btn{flex:0 0 auto;font-size:13px;font-weight:700;padding:8px 14px;border-radius:10px;background:var(--card-2);color:var(--text-3);min-width:54px;transition:all .15s ease}
.supps-amt-btn.on{background:var(--accent);color:#fff}
.supps-amt-btn:active{transform:scale(.94)}

/* Pull-forward (skip rest, do next workout) */
.pull-forward-wrap{margin:18px 16px 8px}
.pull-forward-btn{width:100%;padding:14px 18px;background:linear-gradient(135deg,#0a84ff 0%,#30d158 100%);color:#fff;border-radius:12px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:transform .15s ease}
.pull-forward-btn:active{transform:scale(.97)}
.pull-forward-btn .arr{font-size:18px;flex:0 0 auto}
.pull-forward-hint{font-size:12px;color:var(--text-2);margin-top:8px;line-height:1.4;padding:0 4px}

/* Pulled-forward banner revert button (lives inside .makeup-banner) */
.revert-btn{flex:0 0 auto;padding:8px 12px;background:rgba(255,255,255,.25);border-radius:9px;font-size:12px;font-weight:600;color:#fff;border:0}
.revert-btn:active{transform:scale(.95)}
.makeup-banner.pulled{background:linear-gradient(135deg,#0a84ff 0%,#30d158 100%)}

/* Day actions (Done / Skip) */
.day-actions{margin:8px 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.day-action{padding:14px 0;border-radius:12px;background:var(--card);font-size:14px;font-weight:600;color:var(--text-2);transition:all .18s ease}
.day-action:active{transform:scale(.97)}
.day-action.done.active{background:var(--green);color:#fff}
.day-action.skip.active{background:var(--orange);color:#fff}

/* Cloud sync card */
.sync-card{margin:0 16px 16px;background:var(--card);border-radius:14px;padding:16px;display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.sync-icon{font-size:24px;flex:0 0 auto;line-height:1.2}
.sync-text{flex:1;min-width:140px}
.sync-title{font-size:15px;font-weight:600;letter-spacing:-.1px}
.sync-sub{font-size:12px;color:var(--text-2);margin-top:3px;line-height:1.4}
.sync-err{font-size:12px;color:var(--red);margin-top:4px}
.sync-actions{display:flex;gap:8px;flex:0 0 auto;flex-wrap:wrap}
.sync-btn{padding:9px 14px;background:var(--accent);color:#fff;border-radius:10px;font-size:13px;font-weight:600;flex:0 0 auto}
.sync-btn:active{transform:scale(.95)}
.sync-btn.small{padding:8px 12px;font-size:12px}
.sync-btn.ghost{background:transparent;color:var(--text-2);font-weight:500}

/* Modal (cloud sync setup) */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:300;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:#1c1c1e;border-radius:18px 18px 0 0;width:100%;padding:24px 20px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:slideUp .25s cubic-bezier(.2,.9,.3,1.1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title{font-size:22px;font-weight:700;margin-bottom:14px;letter-spacing:-.3px}
.modal-body{font-size:14px;color:var(--text-2);line-height:1.5}
.modal-body p{margin:0 0 8px}
.modal-body ol{padding-left:20px;margin:8px 0 14px}
.modal-body li{margin-bottom:6px}
.modal-body a{color:var(--accent);text-decoration:none}
.modal-body input{width:100%;background:#2c2c2e;border:1px solid var(--hairline);color:var(--text);padding:14px 16px;border-radius:10px;font-size:14px;font-family:-apple-system,monospace;margin-top:8px;-webkit-text-security:disc}
.modal-body input:focus{outline:2px solid var(--accent);border-color:transparent}
.modal-status{margin-top:10px;font-size:13px;color:var(--text-2);min-height:20px}
.modal-status.err{color:var(--red)}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.modal-actions button{padding:14px 0;background:var(--card-2);border-radius:10px;font-size:15px;font-weight:600;color:var(--text)}
.modal-actions button.primary{background:var(--accent);color:#fff}

.bonus-block{margin:30px 16px 20px;border-radius:18px;padding:1.5px;background:linear-gradient(135deg,#ff375f 0%,#bf5af2 100%)}
.bonus-inner{background:var(--bg);border-radius:16.5px;padding:20px}
.bonus-tag{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;background:linear-gradient(135deg,#ff375f,#bf5af2);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
.bonus-title{font-size:22px;font-weight:700;letter-spacing:-.3px;margin:0 0 4px}
.bonus-subtitle{font-size:14px;color:var(--text-2);margin-bottom:14px;line-height:1.4}
.bonus-block .exercise{background:var(--card);margin:0 0 10px}
.bonus-block .exercise:last-child{margin-bottom:0}
.bonus-block .exercise.complete{background:linear-gradient(135deg,#4a1d3a 0%,#2d1a3a 100%)}

.cardio-blocks{margin:0 16px}
.cardio-block{background:var(--card);border-radius:14px;padding:16px 18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.cardio-block .duration{font-size:15px;font-weight:700;letter-spacing:-.2px;flex:0 0 auto;color:var(--purple);min-width:78px;text-align:left}
.recovery .cardio-block .duration{color:var(--green)}
.cardio-block .label{font-size:15px;font-weight:600;margin-bottom:3px}
.cardio-block .detail{font-size:13px;color:var(--text-2);line-height:1.45}

.class-recs{background:var(--card);border-radius:14px;padding:16px 18px;margin:12px 16px}
.class-recs h3{font-size:11px;text-transform:uppercase;color:var(--text-2);font-weight:700;letter-spacing:.8px;margin:0 0 10px}
.class-recs ul{margin:0;padding:0;list-style:none}
.class-recs li{font-size:15px;padding:7px 0;display:flex;align-items:center;gap:12px}
.class-recs li::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--purple);flex:0 0 auto}

.guidance-grid{margin:0 16px}
.guidance-card{background:var(--card);border-radius:14px;padding:16px 18px;margin-bottom:10px;display:flex;align-items:flex-start;gap:14px}
.guidance-card .ic{font-size:24px;flex:0 0 auto;line-height:1}
.guidance-card .gtitle{font-size:15px;font-weight:600;margin:0 0 3px}
.guidance-card .gtext{font-size:13px;color:var(--text-2);line-height:1.45;margin:0}

.complete-toggle{margin:18px 16px;background:var(--card);border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:14px;-webkit-user-select:none;transition:background .25s ease}
.complete-toggle.done{background:linear-gradient(135deg,#0e3d22,#1a4f2c)}
.complete-toggle .check{width:30px;height:30px;border-radius:50%;border:2px solid var(--text-3);display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:all .18s ease}
.complete-toggle.done .check{background:var(--green);border-color:var(--green)}
.complete-toggle .label{font-size:16px;font-weight:600}

/* Progress view */
.stat-hero{margin:8px 16px 12px;background:linear-gradient(135deg,#ff9f0a 0%,#ff375f 100%);border-radius:18px;padding:24px}
.stat-hero .label{font-size:13px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;opacity:.92;margin-bottom:4px}
.stat-hero .value{font-size:54px;font-weight:800;letter-spacing:-1.2px;line-height:1;margin-bottom:6px}
.stat-hero .sub{font-size:14px;opacity:.92;line-height:1.35}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 18px}
.stat-card{background:var(--card);border-radius:14px;padding:14px 16px}
.stat-card .label{font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--text-2);margin-bottom:6px}
.stat-card .value{font-size:26px;font-weight:700;letter-spacing:-.4px;line-height:1.05}
.stat-card .sub{font-size:12px;color:var(--text-2);margin-top:3px}

.activity-row{display:flex;gap:3px;justify-content:space-between;margin:0 16px 18px;background:var(--card);border-radius:14px;padding:14px 10px}
.activity-day{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.activity-day .dlabel{font-size:9px;color:var(--text-2);letter-spacing:.4px;text-transform:uppercase;font-weight:600}
.activity-day .dot{width:16px;height:16px;border-radius:5px;background:var(--card-2);display:flex;align-items:center;justify-content:center}
.activity-day.done .dot{background:var(--green)}
.activity-day.future .dot{background:var(--card-2);opacity:.5}
.activity-day.today .dlabel{color:var(--accent)}

.prog-row{background:var(--card);border-radius:14px;padding:16px;margin:0 16px 10px}
.prog-row .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px}
.prog-row .name{font-size:15px;font-weight:600;letter-spacing:-.1px;flex:1;min-width:0}
.prog-row .cur{font-size:13px;color:var(--accent);font-weight:600;flex:0 0 auto}
.prog-row .cur.maxed{color:var(--orange)}
.prog-bar{height:6px;background:var(--card-2);border-radius:3px;overflow:hidden;margin-bottom:8px}
.prog-bar .fill{height:100%;background:linear-gradient(90deg,#0a84ff 0%,#30d158 100%);border-radius:3px;transition:width .4s ease}
.prog-row .next{font-size:12px;color:var(--text-2);line-height:1.4}
.prog-row .controls{display:flex;gap:8px;margin-top:10px}
.prog-row .controls button{flex:1;padding:8px 0;background:var(--card-2);border-radius:8px;font-size:12px;font-weight:600;color:var(--text-2)}
.prog-row .controls button:active{background:var(--text-3);color:var(--text)}
.prog-row .controls button.danger{color:var(--red)}

.rest-timer{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);background:var(--card-2);border-radius:18px;padding:14px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 12px 40px rgba(0,0,0,.7);transform:translateY(160%);transition:transform .35s cubic-bezier(.2,.9,.3,1.2),background .25s ease;z-index:100}
.rest-timer.show{transform:translateY(0)}
.rest-timer.warn{background:var(--red);animation:pulseRed 1s ease-in-out infinite}
.rest-timer.warn *{color:#fff !important}
@keyframes pulseRed{0%,100%{box-shadow:0 0 0 0 rgba(255,69,58,.5),0 12px 40px rgba(0,0,0,.7)}50%{box-shadow:0 0 0 14px rgba(255,69,58,0),0 12px 40px rgba(0,0,0,.7)}}
.rest-timer .info{flex:1;min-width:0}
.rest-timer .label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;color:var(--text-2);margin-bottom:2px}
.rest-timer .time{font-size:34px;font-weight:700;letter-spacing:-.6px;font-variant-numeric:tabular-nums;line-height:1}
.rest-timer .actions{display:flex;gap:8px;flex:0 0 auto}
.rest-timer .actions button{padding:10px 14px;border-radius:11px;background:rgba(255,255,255,.12);font-size:13px;font-weight:600}
.rest-timer.warn .actions button{background:rgba(255,255,255,.22)}
.rest-timer .actions button:active{transform:scale(.95)}

.toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 16px);background:linear-gradient(135deg,#ff9f0a,#ff375f);border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.7);transform:translateY(calc(-100% - 80px));opacity:0;pointer-events:none;transition:transform .4s cubic-bezier(.2,.9,.3,1.2),opacity .25s ease;z-index:200}
.toast.show{transform:translateY(0);opacity:1;pointer-events:auto}
.toast .ic{font-size:24px}
.toast .ttitle{font-size:14px;font-weight:700;letter-spacing:-.1px;margin-bottom:2px}
.toast .ttext{font-size:12px;opacity:.95;line-height:1.35}

.footnote{padding:32px 32px 16px;text-align:center;font-size:12px;color:var(--text-3);line-height:1.6}
</style>
</head>
<body>
<header class="header">
  <div class="date" id="date"></div>
  <h1 class="day-name" id="day-name">Today</h1>
  <div class="segment">
    <button id="seg-today" class="active">Today</button>
    <button id="seg-progress">Progress</button>
  </div>
  <div class="day-pills" id="day-pills"></div>
</header>
<main id="main"></main>

<div class="rest-timer" id="rest-timer" aria-hidden="true">
  <div class="info">
    <div class="label">Rest</div>
    <div class="time" id="rest-time">1:30</div>
  </div>
  <div class="actions">
    <button id="rest-add">+30s</button>
    <button id="rest-skip">Skip</button>
  </div>
</div>

<div class="toast" id="toast" aria-hidden="true">
  <div class="ic">🎯</div>
  <div><div class="ttitle" id="toast-title">Level up!</div><div class="ttext" id="toast-text"></div></div>
</div>

const REST_DEFAULT = 90;
const STORAGE_KEY = 'lift-progress-v1';
const SUCCESSES_TO_LEVEL = 2; // complete all sets this many sessions in a row to advance
const PROTEIN_PRESETS = [15, 20, 25, 30, 40, 50]; // grams — tap protein amount to cycle
const CREATINE_PRESETS = [3, 5, 10, 15, 20]; // grams — 5 g is standard, 10 g common for older adults, 20 g for short-term loading

let state = { daily:{}, levels:{}, successes:{}, credited:{}, supps:{} };
try {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    const parsed = JSON.parse(raw);
    state = Object.assign({daily:{},levels:{},successes:{},credited:{},supps:{}}, parsed);
    if (!state.daily) state.daily = {};
    if (!state.levels) state.levels = {};
    if (!state.successes) state.successes = {};
    if (!state.credited) state.credited = {};
    if (!state.supps) state.supps = {};
  }
} catch(e) {}

let viewedDay = new Date().getDay();
let view = 'today'; // 'today' | 'progress'
let restState = { interval:null, remaining:0 };

const $ = id => document.getElementById(id);

function todayKey(){ return dateToKey(new Date()); }
function dateToKey(d){ return d.toISOString().slice(0,10); }
function dayKeyForView(dayIdx){
  const today = new Date();
  const diff = dayIdx - today.getDay();
  const d = new Date(today); d.setDate(today.getDate() + diff);
  return dateToKey(d);
}
function save(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
  schedulePush();
}

/* ============================================================
   CLOUD SYNC (GitHub gist)
   The user pastes a personal access token (gist scope) once. From then on,
   every change is debounced-pushed to a private gist named "Lift Progress".
   On app open, we pull the latest gist content first. Last-write-wins; for
   personal use across a phone + occasional second device this is fine.
   ============================================================ */
const SYNC_KEY = 'lift-sync-v1';
let syncState = { token:null, gistId:null, lastSync:0, error:null };
try {
  const raw = localStorage.getItem(SYNC_KEY);
  if (raw) syncState = Object.assign(syncState, JSON.parse(raw));
} catch(e){}
function saveSyncState(){ try { localStorage.setItem(SYNC_KEY, JSON.stringify(syncState)); } catch(e){} }
function isSyncEnabled(){ return !!syncState.token && !!syncState.gistId; }

let pushTimer = null;
function schedulePush(){
  if (!isSyncEnabled()) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => pushToGist(), 3000);
}

async function setupSync(token){
  try {
    // Validate token + load user
    const userResp = await fetch('https://api.github.com/user', {
      headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github+json' }
    });
    if (!userResp.ok) throw new Error(userResp.status === 401 ? 'Invalid token' : `Auth failed (${userResp.status})`);

    // Hunt for an existing "Lift Progress" gist (paged)
    let found = null;
    for (let page = 1; page <= 5 && !found; page++){
      const r = await fetch(`https://api.github.com/gists?per_page=100&page=${page}`, {
        headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github+json' }
      });
      if (!r.ok) throw new Error(`List gists failed (${r.status})`);
      const gists = await r.json();
      if (!Array.isArray(gists) || gists.length === 0) break;
      found = gists.find(g => g.description === 'Lift Progress' && g.files && g.files['state.json']);
    }

    syncState.token = token;
    syncState.error = null;

    if (found){
      syncState.gistId = found.id;
      saveSyncState();
      // Pull existing state from cloud
      await pullFromGist();
    } else {
      // Create a new private gist with current state
      const resp = await fetch('https://api.github.com/gists', {
        method: 'POST',
        headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github+json' },
        body: JSON.stringify({
          description: 'Lift Progress',
          public: false,
          files: { 'state.json': { content: JSON.stringify(state, null, 2) } }
        })
      });
      if (!resp.ok) throw new Error(`Create gist failed (${resp.status})`);
      const gist = await resp.json();
      syncState.gistId = gist.id;
      syncState.lastSync = Date.now();
      saveSyncState();
    }
    return { ok: true };
  } catch(e){
    syncState.error = e.message;
    saveSyncState();
    return { ok: false, error: e.message };
  }
}

async function pullFromGist(){
  if (!isSyncEnabled()) return false;
  try {
    const r = await fetch(`https://api.github.com/gists/${syncState.gistId}`, {
      headers: { Authorization: `token ${syncState.token}`, Accept: 'application/vnd.github+json' }
    });
    if (!r.ok) throw new Error(`Pull failed (${r.status})`);
    const gist = await r.json();
    const file = gist.files && gist.files['state.json'];
    if (file && file.content){
      const remote = JSON.parse(file.content);
      // Replace local state with remote (last-write-wins). Keep the shape we expect.
      state = Object.assign({daily:{},levels:{},successes:{},credited:{},supps:{}}, remote);
      // Save locally without re-triggering push
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
    }
    syncState.lastSync = Date.now();
    syncState.error = null;
    saveSyncState();
    return true;
  } catch(e){
    syncState.error = e.message;
    saveSyncState();
    return false;
  }
}

async function pushToGist(){
  if (!isSyncEnabled()) return false;
  try {
    const r = await fetch(`https://api.github.com/gists/${syncState.gistId}`, {
      method: 'PATCH',
      headers: { Authorization: `token ${syncState.token}`, Accept: 'application/vnd.github+json' },
      body: JSON.stringify({
        files: { 'state.json': { content: JSON.stringify(state, null, 2) } }
      })
    });
    if (!r.ok) throw new Error(`Push failed (${r.status})`);
    syncState.lastSync = Date.now();
    syncState.error = null;
    saveSyncState();
    return true;
  } catch(e){
    syncState.error = e.message;
    saveSyncState();
    return false;
  }
}

function disconnectSync(){
  syncState.token = null;
  syncState.gistId = null;
  syncState.lastSync = 0;
  syncState.error = null;
  saveSyncState();
}

function humanTimeAgo(ts){
  if (!ts) return 'never';
  const diff = Date.now() - ts;
  if (diff < 30000) return 'just now';
  if (diff < 3600000) return Math.floor(diff/60000) + ' min ago';
  if (diff < 86400000) return Math.floor(diff/3600000) + ' hr ago';
  return Math.floor(diff/86400000) + ' days ago';
}

/* Sets are stored as an array of {done, weight, reps?} objects.
   Older saves stored a plain bool array — normalizeSets migrates on read.
   `reps` is only set on AMRAP exercises where the user enters actual reps. */
function normalizeSets(raw, suggestedWeight){
  if (!Array.isArray(raw)) return [];
  return raw.map(item => {
    if (typeof item === 'object' && item !== null){
      return {
        done: !!item.done,
        weight: (item.weight === undefined || item.weight === null || item.weight === '') ? String(suggestedWeight) : String(item.weight),
        reps: (item.reps === undefined || item.reps === null) ? '' : String(item.reps)
      };
    }
    return { done: !!item, weight: String(suggestedWeight), reps: '' };
  });
}

/* Parse a prescribed reps string into a numeric count for volume math.
   "10" → 10, "12/leg" → 24, "30 sec" → 30, "AMRAP" → null (look at user-entered) */
function parseRepsCount(reps){
  if (typeof reps === 'number') return reps;
  if (!reps) return 0;
  const s = String(reps);
  if (/AMRAP/i.test(s)) return null;
  const perLeg = s.match(/(\d+)\s*\/\s*(?:leg|side)/i);
  if (perLeg) return parseInt(perLeg[1], 10) * 2;
  const sec = s.match(/(\d+)\s*sec/i);
  if (sec) return parseInt(sec[1], 10);
  const num = s.match(/(\d+)/);
  return num ? parseInt(num[1], 10) : 0;
}

/* Bodyweight counts as ~1 lb-equivalent in the volume formula so a BW set
   still contributes meaningfully without being dominated by DB exercises. */
function parseWeightVal(weight){
  if (weight == null) return 0;
  const s = String(weight).trim();
  if (!s) return 0;
  if (/^BW$/i.test(s)) return 1;
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function isAmrapReps(reps){ return /AMRAP/i.test(String(reps || '')); }
function getSets(dayIdx, exId){ const k = dayKeyForView(dayIdx); return (state.daily[k] && state.daily[k][exId]) || []; }
function setSets(dayIdx, exId, arr){ const k = dayKeyForView(dayIdx); if(!state.daily[k]) state.daily[k]={}; state.daily[k][exId]=arr; save(); }
function setsDoneCount(arr){
  if (!Array.isArray(arr)) return 0;
  return arr.filter(s => s && (typeof s === 'object' ? s.done : !!s)).length;
}

/* Per-day extra cardio / run log */
function getRun(dayIdx){
  const k = dayKeyForView(dayIdx);
  const raw = state.daily[k] && state.daily[k]._run;
  if (!raw) return { done:false, distance:'', duration:'', notes:'' };
  return { done:!!raw.done, distance:raw.distance||'', duration:raw.duration||'', notes:raw.notes||'' };
}
function setRun(dayIdx, partial){
  const k = dayKeyForView(dayIdx);
  if (!state.daily[k]) state.daily[k] = {};
  const cur = getRun(dayIdx);
  state.daily[k]._run = Object.assign(cur, partial);
  save();
}
function getFlag(dayIdx, key){ const k = dayKeyForView(dayIdx); return state.daily[k] && state.daily[k][key]; }
function setFlag(dayIdx, key, val){ const k = dayKeyForView(dayIdx); if(!state.daily[k]) state.daily[k]={}; state.daily[k][key]=val; save(); }

function getLevel(exId){ return state.levels[exId] || 0; }
function setLevel(exId, lvl){ state.levels[exId] = Math.max(0, lvl); save(); }
function getCurrent(ex){
  const lvl = Math.min(getLevel(ex.id), ex.progression.length - 1);
  return ex.progression[lvl];
}
function getSuccesses(exId){ return state.successes[exId] || 0; }
function setSuccesses(exId, n){ state.successes[exId] = Math.max(0, n); save(); }

function isMaxed(ex){ return getLevel(ex.id) >= ex.progression.length - 1; }

function getDayStatus(dayIdx){
  const k = dayKeyForView(dayIdx);
  return state.daily[k] && state.daily[k]._status; // 'done' | 'skipped' | undefined
}
function setDayStatus(dayIdx, status){
  const k = dayKeyForView(dayIdx);
  if (!state.daily[k]) state.daily[k] = {};
  if (status) state.daily[k]._status = status;
  else delete state.daily[k]._status;
  save();
}

/* ============================================================
   EFFECTIVE WEEK SCHEDULE
   When a day is skipped — explicitly via the Skip button OR implicitly by
   never opening the app and logging anything that day — all subsequent
   (un-skipped, un-frozen) workouts slide forward by one slot.

   Thursday is frozen as rest because the user can't work out that day.
   The queue order is the original Mon→Sun program minus Thursday:
     [Push, Cardio, Pull, Lower, Cardio, Rest]
   ============================================================ */

// True if this past day has no logged engagement (no sets, no _status, no flags).
// Today and future days are never auto-skipped — only days strictly before today.
function isAutoSkipped(dateKey, todayKey){
  if (dateKey >= todayKey) return false;
  const d = state.daily[dateKey];
  if (!d) return true; // no entry at all
  if (d._status) return false; // explicit done or skipped already handled
  if (d._run && d._run.done) return false; // logged a run that day
  for (const k of Object.keys(d)){
    if (k.startsWith('_')) continue;
    if (k === 'cardio-done' || k === 'recovery-done'){ if (d[k]) return false; continue; }
    const arr = d[k];
    if (Array.isArray(arr) && arr.some(s => s && (typeof s === 'object' ? s.done : !!s))) return false;
  }
  return true;
}

// True if pull-forward on this day would yield a real workout from the queue.
// Used to decide whether to show the "Skip rest" button.
function canPullForward(targetDayIdx){
  const today = new Date();
  if (targetDayIdx !== today.getDay()) return false; // only allow on today
  const todayKey = dateToKey(today);
  const monday = new Date(today);
  monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));

  const weekOrder = [1, 2, 3, 4, 5, 6, 0];
  const queue = weekOrder.filter(idx => idx !== 4);

  let qIdx = 0;
  for (let pos = 0; pos < weekOrder.length; pos++){
    const idx = weekOrder[pos];
    const date = new Date(monday.getTime() + pos * 86400000);
    const k = dateToKey(date);
    const status = state.daily[k] && state.daily[k]._status;

    if (idx === targetDayIdx){
      const isFrozen = idx === 4;
      const pullIdx = isFrozen ? qIdx : qIdx + 1;
      return queue[pullIdx] !== undefined;
    }

    if (status === 'pulled'){
      qIdx += (idx === 4) ? 1 : 2;
      continue;
    }
    if (idx === 4) continue;
    const auto = isAutoSkipped(k, todayKey);
    if (status === 'skipped' || auto) continue;
    qIdx++;
  }
  return false;
}

function getEffectiveDay(targetDayIdx){
  const today = new Date();
  const todayKey = dateToKey(today);
  const monday = new Date(today);
  monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));

  // Days in week order: Mon=1, Tue=2, Wed=3, Thu=4, Fri=5, Sat=6, Sun=0
  const weekOrder = [1, 2, 3, 4, 5, 6, 0];
  // Queue of original program day indices, excluding the Thursday rest (frozen)
  const queue = weekOrder.filter(idx => idx !== 4);

  let qIdx = 0;
  for (let pos = 0; pos < weekOrder.length; pos++){
    const idx = weekOrder[pos];
    const date = new Date(monday.getTime() + pos * 86400000);
    const k = dateToKey(date);
    const status = state.daily[k] && state.daily[k]._status;

    // Pulled forward: today does the next workout in the queue. Frozen days
    // (Thursday) consume one slot; non-frozen days consume two (their own
    // scheduled slot is dropped + tomorrow's slot is brought to today).
    // This check runs before the frozen-day check so Thursday can also pull.
    if (status === 'pulled'){
      const isFrozen = idx === 4;
      if (idx === targetDayIdx){
        const pullIdx = isFrozen ? qIdx : qIdx + 1;
        const pullKey = queue[pullIdx];
        if (pullKey === undefined){
          return {
            type:'rest',
            title:'Nothing left to pull',
            subtitle:'You\'ve done everything scheduled this week.',
            _pulled:true, _emptyPull:true,
            _originalTitle: PROGRAM[idx].title,
            guidance:[{ic:'😌',title:'Bonus rest',text:'No more workouts in this week\'s queue. Next week starts fresh.'}]
          };
        }
        return Object.assign({}, PROGRAM[pullKey], {_pulled:true, _originalTitle: PROGRAM[idx].title});
      }
      qIdx += isFrozen ? 1 : 2;
      continue;
    }

    // Thursday is always rest, doesn't consume from the queue
    if (idx === 4){
      if (idx === targetDayIdx) return Object.assign({}, PROGRAM[idx], {_frozen: true});
      continue;
    }

    const auto = isAutoSkipped(k, todayKey);
    const skipped = status === 'skipped' || auto;

    if (skipped){
      if (idx === targetDayIdx){
        const wasManual = status === 'skipped';
        return {
          type:'rest',
          title: wasManual ? 'Skipped' : 'Missed',
          subtitle: wasManual
            ? 'You skipped this day. The rest of the week has shifted forward.'
            : 'No activity logged. The rest of the week has shifted forward.',
          _skipped:true,
          _autoSkipped: !wasManual,
          _originalTitle: PROGRAM[idx].title,
          guidance:[
            {ic:'⏭',title: wasManual ? 'Day skipped' : 'Day missed',
              text:'Your remaining workouts have shifted forward so you don\'t miss any training.'},
            {ic:'↪',title:'See the new schedule',
              text:'Tap the day pills above to see how the rest of your week now lines up.'}
          ]
        };
      }
      // Skipped/missed doesn't advance the queue — next day picks up the slot
      continue;
    }

    if (idx === targetDayIdx){
      const effKey = queue[qIdx];
      if (effKey === undefined){
        return {
          type:'rest',
          title:'Bonus rest',
          subtitle:'Earlier shifts pushed all your scheduled work past today.',
          guidance:[{ic:'😌',title:'Take it',text:'Earlier-week skips pushed your workouts to fill the available days. Enjoy the extra rest.'}]
        };
      }
      return PROGRAM[effKey];
    }
    qIdx++;
  }
  return PROGRAM[targetDayIdx];
}

function getSupps(dayIdx){
  const k = dayKeyForView(dayIdx);
  const raw = state.supps[k] || {};
  // Creatine used to be boolean; migrate boolean→number on read
  const creatine = typeof raw.creatine === 'boolean' ? (raw.creatine ? 5 : 0) : (raw.creatine || 0);
  return { creatine, protein: raw.protein || 0 };
}
function setSupps(dayIdx, partial){
  const k = dayKeyForView(dayIdx);
  state.supps[k] = Object.assign(getSupps(dayIdx), partial);
  save();
}

/* All strength exercises across the week, for the Progress view */
function allStrengthExercises(){
  const out = [];
  Object.values(PROGRAM).forEach(day => {
    if (day.type === 'strength') {
      day.exercises.forEach(ex => out.push({ ex, dayName: day.title }));
      if (day.bonus) day.bonus.exercises.forEach(ex => out.push({ ex, dayName: day.bonus.title, bonus:true }));
    }
  });
  return out;
}

/* ============================================================

function buildDayActions(){
  const status = getDayStatus(viewedDay);
  const wrap = document.createElement('div');
  wrap.className = 'day-actions';
  wrap.innerHTML = `
    <button class="day-action done ${status==='done'?'active':''}" data-action="done">

    <button class="day-action skip ${status==='skipped'?'active':''}" data-action="skipped">
      ${status==='skipped' ? '↳ Skipped' : 'Skip today'}
    </button>
  `;
  wrap.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => {
      const newStatus = btn.dataset.action;
      const cur = getDayStatus(viewedDay);
      setDayStatus(viewedDay, cur === newStatus ? null : newStatus);
      if (navigator.vibrate) navigator.vibrate(20);
      renderMain();
    };
  });
  return wrap;
}

/* ============================================================
   SHIFT BANNER
   Informational notice shown when the day's effective workout differs from
   what was originally scheduled — i.e., the schedule has shifted because of
   an earlier skip. No action needed; the day's content already reflects the
   shifted workout.
   ============================================================ */
function buildShiftBanner(){
  const effective = getEffectiveDay(viewedDay);
  const natural = PROGRAM[viewedDay];
  const k = dayKeyForView(viewedDay);
  const status = state.daily[k] && state.daily[k]._status;
  if (effective._frozen) return null;

  // Pulled-forward: today is doing tomorrow's workout. Show a banner with revert.
  if (status === 'pulled' && !effective._emptyPull){
    const banner = document.createElement('div');
    banner.className = 'makeup-banner pulled';
    banner.innerHTML = `
      <div class="makeup-icon">⏵</div>
      <div class="makeup-text">
        <div class="makeup-title">Pulled forward — ${effective.title}</div>
        <div class="makeup-sub">Doing tomorrow's workout today. The rest of the week has shifted back by a day.</div>
      </div>
      <button class="revert-btn">Revert</button>
    `;
    banner.querySelector('.revert-btn').onclick = (e) => {
      e.stopPropagation();
      setDayStatus(viewedDay, null);
      if (navigator.vibrate) navigator.vibrate(15);
      renderMain();
    };
    return banner;
  }

  if (!effective._skipped && effective.title === natural.title) return null;

  const banner = document.createElement('div');
  banner.className = 'makeup-banner';
  if (effective._skipped){
    const word = effective._autoSkipped ? 'Missed' : 'Skipped';
    const reason = effective._autoSkipped ? 'No activity logged' : 'You skipped this day';
    banner.innerHTML = `
      <div class="makeup-icon">⏭</div>
      <div class="makeup-text">
        <div class="makeup-title">${word} — schedule shifted</div>
        <div class="makeup-sub">${reason}. ${effective._originalTitle} has moved to a later day this week.</div>
      </div>
    `;
  } else {
    banner.innerHTML = `
      <div class="makeup-icon">↻</div>
      <div class="makeup-text">
        <div class="makeup-title">Shifted forward</div>
        <div class="makeup-sub">Today is ${effective.title} because of earlier missed days this week. Set tracking and progression still apply normally.</div>
      </div>
    `;
  }
  return banner;
}

function nextPreset(current, presets){
  if (current === 0) return presets[0];
  const idx = presets.indexOf(current);
  return idx < 0 ? presets[0] : presets[(idx + 1) % presets.length];
}

/* ============================================================
   WORKOUT SCORE
   Computes a 0–110ish score for the day based on:
   - effort: % of prescribed sets actually marked done
   - intensity: actual volume (weight × reps) vs prescribed volume
   - cardio bonus: +10 if extra cardio was logged
   - over-prescription bonus: +up to ~30 for going beyond suggested weights
   ============================================================ */
function computeDayScore(){
  const day = getEffectiveDay(viewedDay);
  let setsTotal = 0, setsDone = 0;
  let prescribedVol = 0, actualVol = 0;
  let amrapTotal = 0;

  if (day.type === 'strength'){
    const allEx = day.exercises.concat(day.bonus ? day.bonus.exercises : []);
    allEx.forEach(ex => {
      const cur = getCurrent(ex);
      const sets = normalizeSets(getSets(viewedDay, ex.id), cur.weight);
      const sw = parseWeightVal(cur.weight);
      const srBase = parseRepsCount(cur.reps);
      // For AMRAP, treat 30 reps as the "prescribed" baseline so volume math has something to compare to
      const sr = srBase == null ? 30 : srBase;

      for (let i = 0; i < cur.sets; i++){
        setsTotal++;
        prescribedVol += sw * sr;
        const set = sets[i];
        if (set && set.done){
          setsDone++;
          const aw = parseWeightVal(set.weight);
          let ar;
          if (isAmrapReps(cur.reps)){
            ar = parseInt(set.reps, 10) || 0;
            amrapTotal += ar;
          } else {
            ar = sr;
          }
          actualVol += aw * ar;
        }
      }
    });
  }

  const run = getRun(viewedDay);
  const cardioBonus = run.done ? 10 : 0;

  const effort = setsTotal > 0 ? (setsDone / setsTotal) * 100 : 0;
  const volRatio = prescribedVol > 0 ? actualVol / prescribedVol : (run.done ? 1 : 0);
  const volScoreCapped = Math.min(volRatio, 1) * 100;

  let score;
  if (setsTotal > 0){
    // Mostly effort, some intensity, plus over-prescription bonus
    score = Math.round(effort * 0.65 + volScoreCapped * 0.35);
    if (volRatio > 1) score += Math.min(30, Math.round((volRatio - 1) * 60));
    score += cardioBonus;
  } else {
    // Cardio/rest day: completing the day = solid baseline, cardio adds
    score = (getDayStatus(viewedDay) === 'done' ? 75 : 0) + cardioBonus + (run.done ? 15 : 0);
  }

  let grade;
  if (score >= 110) grade = 'S';
  else if (score >= 100) grade = 'A+';
  else if (score >= 92) grade = 'A';
  else if (score >= 85) grade = 'A-';
  else if (score >= 78) grade = 'B+';
  else if (score >= 70) grade = 'B';
  else if (score >= 62) grade = 'C+';
  else if (score >= 55) grade = 'C';
  else if (score >= 40) grade = 'D';
  else grade = 'F';

  return { score, grade, setsDone, setsTotal, prescribedVol, actualVol, volRatio, cardioBonus, run, amrapTotal, dayType: day.type };
}

function fmtVolume(n){
  if (!n) return '0';
  if (n >= 10000) return (n / 1000).toFixed(1) + 'k';
  return Math.round(n).toLocaleString();
}

function buildScoreCard(){
  if (getDayStatus(viewedDay) !== 'done') return null;
  const s = computeDayScore();
  const wrap = document.createElement('div');
  wrap.className = 'score-card';

  let headline;
  if (s.dayType === 'strength'){
    if (s.setsDone === 0) headline = 'Marked done with no sets logged.';
    else if (s.setsDone === s.setsTotal && s.volRatio >= 1) headline = `All ${s.setsTotal} sets completed.${s.volRatio > 1.05 ? ' Pushed past the prescribed weight.' : ''}`;
    else if (s.setsDone === s.setsTotal) headline = `All ${s.setsTotal} sets completed.`;
    else headline = `${s.setsDone} of ${s.setsTotal} sets logged.`;
    if (s.run.done) headline += ' Plus extra cardio.';
  } else {
    headline = s.run.done ? 'Day complete with extra cardio.' : 'Day complete.';
  }

  const stats = [];
  if (s.setsTotal > 0){
    stats.push(`<div class="score-stat"><div class="label">Sets</div><div class="value">${s.setsDone}/${s.setsTotal}</div><div class="sub">completed</div></div>`);
    stats.push(`<div class="score-stat"><div class="label">Volume</div><div class="value">${fmtVolume(s.actualVol)}</div><div class="sub">vs ${fmtVolume(s.prescribedVol)} prescribed</div></div>`);
  }
  if (s.amrapTotal > 0){
    stats.push(`<div class="score-stat"><div class="label">Push-ups</div><div class="value">${s.amrapTotal}</div><div class="sub">total reps</div></div>`);
  }
  if (s.run.done){
    const subParts = [];
    if (s.run.distance) subParts.push(`${escapeAttr(s.run.distance)} mi`);
    if (s.run.duration) subParts.push(`${escapeAttr(s.run.duration)}`);
    stats.push(`<div class="score-stat"><div class="label">Cardio</div><div class="value">+${s.cardioBonus}</div><div class="sub">${subParts.join(' · ') || 'logged'}</div></div>`);
  }

  wrap.innerHTML = `
    <div class="score-inner">
      <div class="score-tag">Workout score</div>
      <div class="score-row">
        <div class="score-num">${s.score}</div>
        <div class="score-grade">
          <div class="glabel">Grade</div>
          <div class="g">${s.grade}</div>
        </div>
      </div>
      <div class="score-headline">${headline}</div>
      ${stats.length ? `<div class="score-stats">${stats.join('')}</div>` : `<div class="score-empty">Log sets, push-ups, or extra cardio for a richer score.</div>`}
    </div>
  `;
  return wrap;
}

/* ============================================================
   RUN / EXTRA CARDIO LOG
   Available on every day so an extra run/ride can be tracked
   independently of the day's prescribed workout.
   ============================================================ */
function buildRunCard(){
  const run = getRun(viewedDay);
  const wrap = document.createElement('div');
  const summary = run.done
    ? [run.distance && `<b>${escapeAttr(run.distance)} mi</b>`, run.duration && `<b>${escapeAttr(run.duration)}</b>`]
        .filter(Boolean).join(' · ')
    : '';
  wrap.innerHTML = `
    <div class="section-heading">Extra cardio</div>
    <div class="run-card${run.done ? ' open' : ''}">
      <div class="run-row" data-key="run-toggle">
        <div class="run-check ${run.done ? 'on' : ''}">${run.done ? CHECK_SVG : ''}</div>
        <div class="run-info">
          <div class="run-label">Did a run / ride</div>
          <div class="run-sub">${run.done ? 'Tap to remove' : 'Tap to log distance, time, or notes'}</div>
        </div>
      </div>
      <div class="run-fields">
        <div class="run-field-row">
          <div class="run-field">
            <label>Distance (mi)</label>
            <input type="text" inputmode="decimal" pattern="[0-9.]*" data-field="distance" value="${escapeAttr(run.distance)}" placeholder="e.g. 3.1" />
          </div>
          <div class="run-field">
            <label>Duration</label>
            <input type="text" inputmode="text" data-field="duration" value="${escapeAttr(run.duration)}" placeholder="e.g. 28:30" />
          </div>
        </div>
        <div class="run-field">
          <label>Notes</label>
          <textarea data-field="notes" placeholder="Pace, route, how it felt…">${escapeAttr(run.notes)}</textarea>
        </div>
      </div>
      ${run.done && summary ? `<div class="run-summary">${summary}</div>` : ''}
    </div>
  `;

  const card = wrap.querySelector('.run-card');

  wrap.querySelector('[data-key="run-toggle"]').onclick = () => {
    const cur = getRun(viewedDay);
    setRun(viewedDay, { done: !cur.done });
    if (!cur.done && navigator.vibrate) navigator.vibrate(15);
    renderMain();
  };

  wrap.querySelectorAll('[data-field]').forEach(input => {
    input.onclick = (e) => e.stopPropagation();
    input.onfocus = (e) => { if (e.target.tagName === 'INPUT') e.target.select(); };
    const commit = (e) => {
      const field = e.target.dataset.field;
      const val = e.target.value;
      const partial = { done: true };
      partial[field] = val;
      setRun(viewedDay, partial);
    };
    input.onchange = commit;
    input.onblur = commit;
  });

  return wrap;
}

function renderStrength(main, day){
  const heading = document.createElement('div');
  heading.className = 'section-heading-row';
  const total = day.exercises.length + (day.bonus ? day.bonus.exercises.length : 0);
  let done = 0;
  const allEx = day.exercises.concat(day.bonus ? day.bonus.exercises : []);
  allEx.forEach(ex => {
    const cur = getCurrent(ex);
    if (setsDoneCount(getSets(viewedDay, ex.id)) >= cur.sets) done++;
  });
  heading.innerHTML = `<h2>Workout</h2><span>${done}/${total} done</span>`;
  main.appendChild(heading);

  day.exercises.forEach((ex, idx) => main.appendChild(buildExerciseCard(ex, idx + 1)));

  if (day.bonus){
    const b = document.createElement('div');
    b.className = 'bonus-block';
    const inner = document.createElement('div');
    inner.className = 'bonus-inner';
    inner.innerHTML = `
      <div class="bonus-tag">Bonus Block</div>
      <h3 class="bonus-title">${day.bonus.title}</h3>
      <div class="bonus-subtitle">${day.bonus.subtitle}</div>
    `;
    day.bonus.exercises.forEach((ex, i) => inner.appendChild(buildExerciseCard(ex, i + 1, true)));
    b.appendChild(inner);
    main.appendChild(b);
  }
}

const CHECK_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><polyline points="5 12 10 17 19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* Build a YouTube search URL for an exercise. Search > specific video — links never go stale,
   and you can pick whichever instructor's style you like. */
function videoUrl(ex){
  if (ex.video) return ex.video;
  const q = (ex.name + ' form')
    .toLowerCase()
    .replace(/\bdb\b/g, 'dumbbell')
    .replace(/[^a-z0-9 ]/g, '')
    .trim()
    .replace(/\s+/g, '+');
  return `https://www.youtube.com/results?search_query=${q}`;
}

function buildExerciseCard(ex, num, isBonus){
  const card = document.createElement('div');
  card.className = 'exercise';
  const cur = getCurrent(ex);
  const sets = normalizeSets(getSets(viewedDay, ex.id), cur.weight);
  const completedCount = setsDoneCount(sets);
  if (completedCount >= cur.sets) card.classList.add('complete');

  const lvl = getLevel(ex.id);
  const maxLvl = ex.progression.length - 1;
  const maxed = lvl >= maxLvl;
  const successes = getSuccesses(ex.id);

  const labelStr = cur.label ? ` · ${cur.label}` : '';
  let nextUp = '';
  if (!maxed){
    const next = ex.progression[lvl + 1];
    const remaining = SUCCESSES_TO_LEVEL - successes;
    nextUp = `Next: ${next.sets}×${next.reps} @ ${next.weight}${next.label ? ' · '+next.label : ''} — ${remaining} more session${remaining===1?'':'s'}`;
  } else {
    nextUp = 'Maxed out — tighten form, slow tempo, or add weight if you upgrade DBs';
  }

  const muscles = MUSCLES[ex.id] || [];
  const muscleLabels = muscles.map(m => MUSCLE_NAMES[m] || m).join(' · ');

  card.innerHTML = `
    <div class="exercise-head">
      <div style="min-width:0;flex:1">
        <div class="exercise-num-row">
          <div class="exercise-num">${isBonus ? 'BONUS ' : ''}#${num}</div>
          <span class="level-badge ${maxed?'maxed':''}">L${lvl + 1}${maxed?' · MAX':''}</span>
        </div>
        <h3 class="exercise-name">${ex.name}</h3>
        <div class="exercise-meta">${cur.sets} × ${cur.reps} · ${ex.rest}s rest${labelStr}</div>
      </div>
      <div class="exercise-weight">
        <div class="w">${cur.weight}</div>
        <div class="l">${cur.weight === 'BW' ? 'bodyweight' : 'suggested'}</div>
      </div>
    </div>
    <div class="set-list"></div>
    <div class="next-up">${nextUp}</div>
    ${muscles.length ? `
      <div class="muscle-row">
        <div class="body-diagram">${bodyDiagramSvg(muscles)}</div>
        <div class="muscle-text">
          <div class="muscle-label">Targets</div>
          <div class="muscle-list">${muscleLabels}</div>
        </div>
      </div>
    ` : ''}
    ${ex.note ? `<div class="exercise-notes">${ex.note}</div>` : ''}
    <a class="video-link" href="${videoUrl(ex)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      Form video
    </a>
  `;

  const listEl = card.querySelector('.set-list');
  const isBW = cur.weight === 'BW';
  const isAmrap = isAmrapReps(cur.reps);
  for (let i = 0; i < cur.sets; i++){
    const setData = sets[i] || { done:false, weight:String(cur.weight), reps:'' };
    const row = document.createElement('div');
    row.className = 'set-row' + (setData.done ? ' done' : '');
    let inputHtml;
    if (isAmrap){
      // AMRAP exercises: enter actual rep count per set
      inputHtml = `<input class="weight-input" type="text" inputmode="numeric" pattern="[0-9]*" data-field="reps" value="${escapeAttr(setData.reps)}" placeholder="—" /><div class="weight-unit">reps</div>`;
    } else if (isBW){
      inputHtml = `<div class="weight-input bw">BW</div><div class="weight-unit"></div>`;
    } else {
      inputHtml = `<input class="weight-input" type="text" inputmode="decimal" pattern="[0-9.]*" data-field="weight" value="${escapeAttr(setData.weight)}" /><div class="weight-unit">lb</div>`;
    }
    row.innerHTML = `
      <div class="set-num">SET ${i + 1}</div>
      <div class="set-target">${isAmrap ? 'AMRAP' : '× ' + cur.reps}</div>
      ${inputHtml}
      <button class="set-check-btn" type="button" aria-label="Mark set ${i+1} done">${setData.done ? CHECK_SVG : (i+1)}</button>
    `;
    const checkBtn = row.querySelector('.set-check-btn');
    checkBtn.onclick = (e) => { e.stopPropagation(); toggleSet(ex, i); };
    const input = row.querySelector('.weight-input');
    if (input && input.tagName === 'INPUT'){
      input.onclick = (e) => e.stopPropagation();
      input.onfocus = (e) => { e.target.select(); };
      const commit = (e) => {
        e.stopPropagation();
        if (input.dataset.field === 'reps') updateSetReps(ex, i, input.value);
        else updateSetWeight(ex, i, input.value, input);
      };
      input.onchange = commit;
      input.onblur = commit;
    }
    listEl.appendChild(row);
  }

  // Long-press to reset
  let pressTimer;
  const startPress = () => {
    pressTimer = setTimeout(() => {
      if (navigator.vibrate) navigator.vibrate(20);
      if (confirm(`Reset all sets for ${ex.name}?`)){
        setSets(viewedDay, ex.id, []);
        // Also un-credit today if it was credited
        const tk = todayKey();
        if (state.credited[ex.id] && state.credited[ex.id][tk]){
          delete state.credited[ex.id][tk];
          // best-effort decrement (don't go negative)
          setSuccesses(ex.id, Math.max(0, getSuccesses(ex.id) - 1));
        }
        renderMain();
      }
    }, 650);
  };
  const cancelPress = () => clearTimeout(pressTimer);
  card.addEventListener('touchstart', startPress, {passive:true});
  card.addEventListener('touchend', cancelPress);
  card.addEventListener('touchmove', cancelPress);
  card.addEventListener('mousedown', startPress);
  card.addEventListener('mouseup', cancelPress);
  card.addEventListener('mouseleave', cancelPress);

  return card;
}

function escapeAttr(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')
    .replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function ensureSetArray(ex){
  const cur = getCurrent(ex);
  const raw = normalizeSets(getSets(viewedDay, ex.id), cur.weight);
  while (raw.length < cur.sets) raw.push({ done:false, weight:String(cur.weight) });
  return raw;
}

function toggleSet(ex, idx){
  const arr = ensureSetArray(ex);
  arr[idx] = Object.assign({}, arr[idx], { done: !arr[idx].done });
  setSets(viewedDay, ex.id, arr);
  if (arr[idx].done){
    if (navigator.vibrate) navigator.vibrate(15);
    startRestTimer(ex.rest || REST_DEFAULT);
  }
  // After toggle, check whether all sets are now complete and credit a session
  maybeCreditCompletion(ex);
  renderMain();
}

function updateSetWeight(ex, idx, value, inputEl){
  const arr = ensureSetArray(ex);
  const trimmed = String(value).trim();
  if (arr[idx].weight === trimmed) return;
  arr[idx] = Object.assign({}, arr[idx], { weight: trimmed });
  // Cascade: any change propagates to all later sets of this exercise
  for (let j = idx + 1; j < arr.length; j++){
    arr[j] = Object.assign({}, arr[j], { weight: trimmed });
  }
  setSets(viewedDay, ex.id, arr);
  // Update DOM in place (no re-render) so we don't steal focus mid-edit
  if (inputEl){
    const card = inputEl.closest('.exercise');
    if (card){
      const inputs = card.querySelectorAll('.set-row .weight-input:not(.bw)');
      for (let j = idx + 1; j < inputs.length; j++){
        if (inputs[j].dataset.field !== 'weight') continue;
        if (inputs[j].value !== trimmed) inputs[j].value = trimmed;
      }
    }
  }
}

function updateSetReps(ex, idx, value){
  const arr = ensureSetArray(ex);
  const trimmed = String(value).trim();
  if ((arr[idx].reps || '') === trimmed) return;
  arr[idx] = Object.assign({}, arr[idx], { reps: trimmed });
  setSets(viewedDay, ex.id, arr);
}

function maybeCreditCompletion(ex){
  const cur = getCurrent(ex);
  const arr = normalizeSets(getSets(viewedDay, ex.id), cur.weight);
  const allDone = arr.length >= cur.sets && arr.slice(0, cur.sets).every(s => s && s.done);
  if (!allDone) return;

  // Only credit if today hasn't already been credited for this exercise
  const tk = todayKey();
  if (!state.credited[ex.id]) state.credited[ex.id] = {};
  if (state.credited[ex.id][tk]) return;
  state.credited[ex.id][tk] = true;

  const newSuccesses = getSuccesses(ex.id) + 1;
  setSuccesses(ex.id, newSuccesses);

  if (newSuccesses >= SUCCESSES_TO_LEVEL && !isMaxed(ex)){
    // Level up!
    setLevel(ex.id, getLevel(ex.id) + 1);
    setSuccesses(ex.id, 0);
    const next = getCurrent(ex);
    showToast('🎯 Level up!', `${ex.name} → ${next.sets} × ${next.reps} @ ${next.weight}${next.weight === 'BW' ? '' : ' lb'}`);
    if (navigator.vibrate) navigator.vibrate([60, 40, 60, 40, 120]);
  }
  save();
}

/* ============================================================
   PROGRESS VIEW
   ============================================================ */
function dayHadActivity(dateStr){
  const d = state.daily[dateStr];
  if (!d) return false;
  // Explicit Done or Skip both count as engagement (skipping is a deliberate choice).
  if (d._status === 'done' || d._status === 'skipped') return true;
  if (d._run && d._run.done) return true; // logged a cardio session
  for (const k of Object.keys(d)){
    if (k.startsWith('_')) continue;
    if (k === 'cardio-done' || k === 'recovery-done'){ if (d[k]) return true; continue; }
    const arr = d[k];
    if (Array.isArray(arr) && arr.some(s => s && (typeof s === 'object' ? s.done : !!s))) return true;
  }
  return false;
}

function computeStreak(){
  const today = new Date();
  let streak = 0;
  for (let i=0; i<400; i++){
    const d = new Date(today); d.setDate(today.getDate() - i);
    const k = dateToKey(d);
    if (dayHadActivity(k)) streak++;
    else if (i === 0) {
      // Today not done yet — streak is whatever yesterday had
      continue;
    } else break;
  }
  return streak;
}

function thisWeekCount(){
  const today = new Date();
  const monday = new Date(today);
  monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));
  let n = 0;
  for (let i=0; i<7; i++){
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    if (dayHadActivity(dateToKey(d))) n++;
  }
  return n;
}

function allTimeCount(){
  return Object.keys(state.daily).filter(k => dayHadActivity(k)).length;
}

function renderProgress(main){
  // Hero — streak
  const streak = computeStreak();
  const hero = document.createElement('div');
  hero.className = 'stat-hero';
  hero.innerHTML = `
    <div class="label">Current Streak</div>
    <div class="value">${streak}</div>
    <div class="sub">${streak === 0 ? 'Start today and the count begins.' : `${streak === 1 ? 'day' : 'days'} of consecutive workouts. Keep it going.`}</div>
  `;
  main.appendChild(hero);

  // Stats row
  const wk = thisWeekCount();
  const all = allTimeCount();
  const stats = document.createElement('div');
  stats.className = 'stats-row';
  stats.innerHTML = `
    <div class="stat-card"><div class="label">This week</div><div class="value">${wk}/7</div><div class="sub">${wk >= 5 ? 'Crushing it' : wk >= 3 ? 'On track' : 'Get after it'}</div></div>
    <div class="stat-card"><div class="label">All-time</div><div class="value">${all}</div><div class="sub">workouts logged</div></div>
  `;
  main.appendChild(stats);

  // Activity — last 14 days
  const heading0 = document.createElement('div');
  heading0.className = 'section-heading';
  heading0.textContent = 'Last 14 days';
  main.appendChild(heading0);

  const act = document.createElement('div');
  act.className = 'activity-row';
  const today = new Date();
  for (let i=13; i>=0; i--){
    const d = new Date(today); d.setDate(today.getDate() - i);
    const k = dateToKey(d);
    const done = dayHadActivity(k);
    const isToday = (i === 0);
    const el = document.createElement('div');
    el.className = 'activity-day' + (done ? ' done' : '') + (isToday ? ' today' : '');
    el.innerHTML = `<div class="dlabel">${DAY_NAMES[d.getDay()]}</div><div class="dot">${done ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><polyline points="5 12 10 17 19 7" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}</div>`;
    act.appendChild(el);
  }
  main.appendChild(act);

  // Per-exercise progression
  const heading = document.createElement('div');
  heading.className = 'section-heading';
  heading.textContent = 'Strength progression';
  main.appendChild(heading);

  const sub = document.createElement('div');
  sub.style.cssText = 'padding:0 20px 12px;font-size:13px;color:var(--text-2);line-height:1.45';
  sub.textContent = 'Complete every set in 2 sessions to auto-advance. Bumps reps first, then weight, then sets.';
  main.appendChild(sub);

  const exs = allStrengthExercises();
  exs.forEach(({ex, dayName, bonus}) => main.appendChild(buildProgressionRow(ex, dayName, bonus)));

  // Cloud sync section
  const syncHeading = document.createElement('div');
  syncHeading.className = 'section-heading';
  syncHeading.textContent = 'Cloud backup';
  main.appendChild(syncHeading);
  main.appendChild(buildSyncCard());

  const ft = document.createElement('div');
  ft.className = 'footnote';
  ft.textContent = 'Tap Bump to manually adjust if a level feels too easy or too hard.';
  main.appendChild(ft);
}

function buildSyncCard(){
  const card = document.createElement('div');
  card.className = 'sync-card';
  if (!isSyncEnabled()){
    card.innerHTML = `
      <div class="sync-icon">☁︎</div>
      <div class="sync-text">
        <div class="sync-title">Local only</div>
        <div class="sync-sub">Set up cloud backup so your progress survives reinstalls and syncs across devices.</div>
      </div>
      <button class="sync-btn">Connect</button>
    `;
    card.querySelector('.sync-btn').onclick = () => showSyncModal();
  } else {
    const ago = humanTimeAgo(syncState.lastSync);
    const errLine = syncState.error ? `<div class="sync-err">${syncState.error}</div>` : '';
    card.innerHTML = `
      <div class="sync-icon">✓</div>
      <div class="sync-text">
        <div class="sync-title">Cloud backup on</div>
        <div class="sync-sub">Last sync ${ago}</div>
        ${errLine}
      </div>
      <div class="sync-actions">
        <button class="sync-btn small" data-action="now">Sync now</button>
        <button class="sync-btn small ghost" data-action="disconnect">Disconnect</button>
      </div>
    `;
    card.querySelector('[data-action="now"]').onclick = async () => {
      await pushToGist();
      const m = $('main'); m.innerHTML = ''; renderProgress(m);
    };
    card.querySelector('[data-action="disconnect"]').onclick = () => {
      if (confirm('Disconnect cloud sync? Your local data stays. The gist remains in your GitHub account but no further updates go there.')){
        disconnectSync();
        const m = $('main'); m.innerHTML = ''; renderProgress(m);
      }
    };
  }
  return card;
}

function showSyncModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" role="dialog">
      <div class="modal-title">Cloud backup</div>
      <div class="modal-body">
        <p>Saves progress to a private GitHub gist that you own. Your token only lives on this device — it's never sent anywhere except GitHub.</p>
        <p style="margin-top:12px"><b>One-time setup:</b></p>
        <ol>
          <li>Open <a href="https://github.com/settings/tokens/new?scopes=gist&description=Lift+sync" target="_blank" rel="noopener">github.com/settings/tokens/new</a></li>
          <li>The form is pre-filled. Pick an expiration (or "no expiration").</li>
          <li>Confirm <b>gist</b> is the only scope checked.</li>
          <li>Scroll down, click <b>Generate token</b>, then copy the token.</li>
          <li>Paste it below and tap Connect.</li>
        </ol>
        <input type="password" id="sync-token-input" placeholder="ghp_… or github_pat_…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
        <div class="modal-status" id="sync-modal-status"></div>
      </div>
      <div class="modal-actions">
        <button data-action="cancel">Cancel</button>
        <button data-action="connect" class="primary">Connect</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  overlay.querySelector('[data-action="cancel"]').onclick = close;
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  overlay.querySelector('[data-action="connect"]').onclick = async () => {
    const tokenInput = overlay.querySelector('#sync-token-input');
    const status = overlay.querySelector('#sync-modal-status');
    const token = tokenInput.value.trim();
    if (!token){ status.textContent = 'Paste a token first.'; status.className = 'modal-status err'; return; }
    status.textContent = 'Connecting…'; status.className = 'modal-status';
    const result = await setupSync(token);
    if (result.ok){
      status.textContent = 'Connected. Pulling latest state…';
      setTimeout(() => {
        close();
        const m = $('main'); m.innerHTML = ''; renderProgress(m);
      }, 700);
    } else {
      status.textContent = 'Failed: ' + (result.error || 'unknown error');
      status.className = 'modal-status err';
    }
  };
}

function buildProgressionRow(ex, dayName, isBonus){
  const lvl = getLevel(ex.id);
  const maxLvl = ex.progression.length - 1;
  const maxed = lvl >= maxLvl;
  const cur = getCurrent(ex);
  const successes = getSuccesses(ex.id);
  const pct = maxed ? 100 : Math.round(((lvl + (successes / SUCCESSES_TO_LEVEL)) / (maxLvl + 1)) * 100);

  const row = document.createElement('div');
  row.className = 'prog-row';
  let nextLine;
  if (maxed){
    nextLine = 'Maxed at L' + (maxLvl + 1) + '. Add weight if you upgrade DBs, or hold and tighten form.';
  } else {
    const next = ex.progression[lvl + 1];
    const remaining = SUCCESSES_TO_LEVEL - successes;
    nextLine = `Next: ${next.sets}×${next.reps} @ ${next.weight}${next.weight==='BW'?'':' lb'}${next.label?' · '+next.label:''} — ${remaining} session${remaining===1?'':'s'} away`;
  }
  row.innerHTML = `
    <div class="top">
      <div>
        <div class="name">${ex.name}${isBonus ? ' · Bonus' : ''}</div>
        <div style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;font-weight:600">${dayName}</div>
      </div>
      <div class="cur ${maxed?'maxed':''}">L${lvl+1}/${maxLvl+1}</div>
    </div>
    <div class="prog-bar"><div class="fill" style="width:${pct}%"></div></div>
    <div style="font-size:13px;color:var(--text);margin-bottom:4px"><b>${cur.sets} × ${cur.reps}</b> @ <b>${cur.weight}${cur.weight==='BW'?'':' lb'}</b>${cur.label ? ' · ' + cur.label : ''}</div>
    <div class="next">${nextLine}</div>
    <div class="controls">
      <button data-act="down">– Bump</button>
      <button data-act="up">+ Bump</button>
      <button data-act="reset" class="danger">Reset</button>
    </div>
  `;
  row.querySelectorAll('button').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const act = b.dataset.act;
    if (act === 'up' && !maxed){ setLevel(ex.id, lvl + 1); setSuccesses(ex.id, 0); }
    else if (act === 'down' && lvl > 0){ setLevel(ex.id, lvl - 1); setSuccesses(ex.id, 0); }
    else if (act === 'reset'){
      if (confirm(`Reset ${ex.name} back to L1?`)){ setLevel(ex.id, 0); setSuccesses(ex.id, 0); }
    }
    if (navigator.vibrate) navigator.vibrate(15);
    renderProgress($('main').replaceChildren ? (function(){ const m = $('main'); m.innerHTML=''; return m; })() : $('main'));
    // Simpler: just re-render the whole progress view
    const m = $('main'); m.innerHTML = ''; renderProgress(m);
  });
  return row;
}

/* ============================================================
   REST TIMER
   ============================================================ */
function startRestTimer(seconds){
  clearInterval(restState.interval);
  restState.remaining = seconds;
  const el = $('rest-timer');
  el.classList.add('show');
  el.classList.remove('warn');
  updateRestDisplay();
  primeAudio();
  restState.interval = setInterval(tickRest, 1000);
}
function tickRest(){
  restState.remaining--;
  updateRestDisplay();
  if (restState.remaining === 10){
    $('rest-timer').classList.add('warn');
    if (navigator.vibrate) navigator.vibrate(60);
  }
  if (restState.remaining <= 0){
    clearInterval(restState.interval);
    if (navigator.vibrate) navigator.vibrate([120, 80, 120, 80, 240]);
    playBeep();
    setTimeout(hideRestTimer, 1600);
  }
}
function updateRestDisplay(){
  const r = Math.max(0, restState.remaining);
  const m = Math.floor(r / 60);
  const s = r % 60;
  $('rest-time').textContent = `${m}:${String(s).padStart(2,'0')}`;
}
function hideRestTimer(){ $('rest-timer').classList.remove('show','warn'); }

$('rest-skip').onclick = () => { clearInterval(restState.interval); hideRestTimer(); };
$('rest-add').onclick = () => {
  if (restState.remaining < 1) return;
  restState.remaining += 30;
  updateRestDisplay();
  if (restState.remaining > 10) $('rest-timer').classList.remove('warn');
};

/* ============================================================
   AUDIO BEEP
   ============================================================ */
let audioCtx = null;
function primeAudio(){
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e){}
}
function playBeep(){
  try {
    primeAudio();
    if (!audioCtx) return;
    const beep = (freq, when, dur) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.value = freq;
      o.type = 'sine';
      g.gain.setValueAtTime(.0001, audioCtx.currentTime + when);
      g.gain.exponentialRampToValueAtTime(.4, audioCtx.currentTime + when + .015);
      g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + when + dur);
      o.start(audioCtx.currentTime + when);
      o.stop(audioCtx.currentTime + when + dur + .05);
    };
    beep(880, 0, .25);
    beep(1175, .28, .35);
  } catch(e){}
}

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer = null;
function showToast(title, text){
  $('toast-title').textContent = title;
  $('toast-text').textContent = text;
  const el = $('toast');
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 4500);
}
$('toast').addEventListener('click', () => $('toast').classList.remove('show'));

   INIT
   ============================================================ */
function renderAll(){ renderHeader(); renderMain(); }
renderAll();

// Pull from cloud on load if sync is enabled. Re-render once we have fresh state.
if (isSyncEnabled()){
  pullFromGist().then(ok => { if (ok) renderAll(); });
}

function scheduleMidnightRefresh(){
  const now = new Date();
  const next = new Date(now);
  next.setHours(24, 0, 5, 0);
  setTimeout(() => {
    viewedDay = new Date().getDay();
    renderAll();
    scheduleMidnightRefresh();
  }, next - now);
}
scheduleMidnightRefresh();

document.addEventListener('visibilitychange', () => {
  if (!document.hidden){
    viewedDay = new Date().getDay();
    renderAll();
  }
});

// Register the service worker so iOS doesn't sit on stale HTML.
// Strategy: network-first (defined in sw.js). Each launch tries the network;
// cache is only used as a fallback when offline.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
